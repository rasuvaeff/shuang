[package]
name = "shuang"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
authors = ["Victor Razuvaev <rasuvaeff@gmail.com>"]
license = "GPL-3.0-or-later"
description = "Freeze apps when the VPN drops: a per-application kill switch that suspends instead of killing"
homepage = "https://github.com/rasuvaeff/shuang"
repository = "https://github.com/rasuvaeff/shuang"
documentation = "https://github.com/rasuvaeff/shuang#readme"
readme = "README.md"
keywords = ["vpn", "kill-switch", "privacy", "cli", "network"]
categories = ["command-line-utilities", "network-programming"]
# `.gitattributes` `export-ignore` only affects `git archive`; Cargo needs its own list.
exclude = [
    "/.github",
    "/.editorconfig",
    "/.gitattributes",
    "/.gitignore",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/scripts",
    "/target",
    "/tests",
    "/docs",
    "*.bak",
]

[[bin]]
name = "shuang"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
ipnet = { version = "2.0", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.38"
tokio = { version = "1.45", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "1.1"

[target.'cfg(unix)'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
nix = { version = "0.31", features = ["signal", "time"] }
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = "0.34"
netlink-sys = "0.9"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.24"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
zip = "9"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest = "1.7"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
